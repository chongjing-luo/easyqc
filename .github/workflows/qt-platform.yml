name: Qt platform verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional exact release ID; provide with manifest SHA-256
        required: false
        type: string
      manifest_sha256:
        description: Optional exact release-manifest SHA-256; provide with release ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: qt-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x86_64
            runner: ubuntu-22.04
            row_id: ci-ubuntu-22.04-x86_64
            lock_path: packaging/locks/python-3.10.17/linux-x86_64/test.txt
          - name: Ubuntu 24.04 x86_64
            runner: ubuntu-24.04
            row_id: ci-ubuntu-24.04-x86_64
            lock_path: packaging/locks/python-3.10.17/linux-x86_64/test.txt
          - name: Windows Server 2022 x64
            runner: windows-2022
            row_id: ci-windows-2022-x86_64
            lock_path: packaging/locks/python-3.10.17/windows-x86_64/test.txt
          - name: macOS 15 arm64
            runner: macos-15
            row_id: ci-macos-15-arm64
            lock_path: packaging/locks/python-3.10.17/macos-arm64/test.txt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      EASYQC_CI_RELEASE_ID: ${{ inputs.release_id }}
      EASYQC_CI_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10.17"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Materialize exact test lock
        run: |
          uv pip sync --system --require-hashes "${{ matrix.lock_path }}"
          uv pip check --system
      - name: Prepare exact CI request
        env:
          EASYQC_LOG_DIR: ${{ runner.temp }}/easyqc-logs-${{ matrix.row_id }}
        run: >-
          python scripts/prepare_ci_verification.py
          --matrix-row-id "${{ matrix.row_id }}"
          --runner-label "${{ matrix.runner }}"
          --target-lock "${{ matrix.lock_path }}"
          --output-root "${{ runner.temp }}/easyqc-ci-inputs-${{ matrix.row_id }}"
      - name: Run and normalize CI verification
        env:
          EASYQC_LOG_DIR: ${{ runner.temp }}/easyqc-logs-${{ matrix.row_id }}
        run: >-
          python scripts/run_platform_verification.py
          --request "${{ runner.temp }}/easyqc-ci-inputs-${{ matrix.row_id }}/verification-request.json"
          --check-plan "${{ runner.temp }}/easyqc-ci-inputs-${{ matrix.row_id }}/automated-check-plan.json"
          --attempt-root "${{ runner.temp }}/easyqc-verification-${{ matrix.row_id }}-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: qt-platform-${{ matrix.row_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/easyqc-ci-inputs-${{ matrix.row_id }}
            ${{ runner.temp }}/easyqc-verification-${{ matrix.row_id }}-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/easyqc-logs-${{ matrix.row_id }}
          if-no-files-found: error
          retention-days: 30
